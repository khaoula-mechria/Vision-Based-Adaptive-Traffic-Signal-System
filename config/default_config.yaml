# Default configuration. Every key here is read by the code and validated on load
# (see src/utils/config_loader.py). Override any value with an environment variable using
# double underscores for nesting, e.g.  TRAFFIC__PERCEPTION__DEVICE=cuda
#                                       TRAFFIC__SIGNAL__TIMING__YELLOW_S=4.5

system:
  log_level: INFO            # DEBUG | INFO | WARNING | ERROR

perception:
  model_name: yolov8n
  model_path: models/yolov8n.pt   # not shipped; see README "Model setup"
  allow_download: false           # true lets Ultralytics fetch stock weights by name
  backend: torch                  # torch | onnx
  onnx_path: models/yolov8n.onnx
  device: cpu                     # cpu | cuda (falls back to cpu if CUDA is unavailable)
  confidence_threshold: 0.5
  nms_threshold: 0.45
  input_size: 640
  min_box_area_px: 100
  max_stale_s: 1.0                # frames older than this make the sensors "degraded"
  max_consecutive_failures: 3     # failed frames before sensors_ok turns False

tracking:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  output_coasting: 5              # keep reporting occluded tracks for this many frames
  max_gap_s: 2.0                  # camera outage that drops all tracks

queue_estimation:
  stopped_speed: 0.15             # body-lengths/s below which a vehicle counts as stopped
  min_stop_s: 1.0
  meters_per_pixel: null          # null = no metre estimates (no camera calibration)
  vehicle_length_meters: 4.5
  rate_window_s: 60
  congestion_thresholds: {low: 5, medium: 10, high: 20}
  lanes: []                       # [{id, approach, polygon: [[x,y],...], stop_line: [[x,y],[x,y]]}]

crosswalks: []                    # [{id: cw_N, polygon: [[x,y],...]}]

emergency:
  detection_confidence: 0.7
  min_detections: 3
  hold_s: 5.0

signal:
  decision_interval_s: 5.0
  timing:                         # seconds; see src/safety/signal_safety.py
    yellow_s: 4.0
    all_red_s: 2.0
    min_green_s: 8.0
    max_green_s: 45.0
    ped_walk_min_s: 7.0
    ped_walk_max_s: 25.0
    ped_clearance_s: 8.0
    max_conflict_hold_s: 20.0
    max_pedestrian_wait_s: 90.0
    uncertain_extra_all_red_s: 2.0
    emergency_min_green_s: 4.0
    emergency_extension_s: 15.0
    fallback_green_s: 20.0
    startup_all_red_s: 6.0
  intersection: null              # null = built-in four-way NS/EW/PED model, or a custom model mapping
  policy: actuated                # fixed | actuated | rl
  rl_checkpoint: models/dqn_best.pt

rl:
  dqn:
    learning_rate: 0.0005
    gamma: 0.97
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 20000
    batch_size: 64
    buffer_size: 100000
    learn_start: 1000
    target_update_steps: 500
    seed: 0
  reward_weights:
    vehicle_wait: 1.0
    pedestrian_wait: 1.5
    queue: 0.5
    throughput: 0.5
    fairness: 0.5
    switching: 0.2
    rejected: 0.1
    violation: 10.0
    emergency: 1.0

simulation:
  sumo_binary: sumo
  step_length_s: 1.0
  episode_s: 1800
  scenario: medium
  seed: 0
